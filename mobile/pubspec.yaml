name: nova_chat

description: Private communication app with temporary messages and WebRTC calls.

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.2.0
  firebase_messaging: ^15.1.0
  flutter_webrtc: ^0.11.7
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.0
  flutter_svg: ^2.0.10
  intl: ^0.19.0

flutter:
  uses-material-design: true
